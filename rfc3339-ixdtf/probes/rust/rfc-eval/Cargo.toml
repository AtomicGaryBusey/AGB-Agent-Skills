[package]
name = "rfc-eval"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
time = { version = "=0.3.55", features = ["parsing", "formatting", "serde-well-known", "macros"] }
jiff = { version = "=0.2.37" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
