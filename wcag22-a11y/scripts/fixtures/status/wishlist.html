<!DOCTYPE html>
<html lang="en">
<head><title>Seed wishlist</title></head>
<body>
<main>
<h1>Seed wishlist</h1>
<form id="wish-form">
  <label for="seed">Seed variety</label> <input id="seed" name="seed">
  <button>Add to wishlist</button>
</form>
<p id="wish-feedback"></p>
<ul id="wish-items"></ul>
<form id="news-form">
  <label for="nmail">Email</label> <input id="nmail" type="email" autocomplete="email">
  <button>Subscribe</button>
</form>
<p id="news-result" role="status"></p>
<script src="wishlist.js"></script>
</main>
</body>
</html>
