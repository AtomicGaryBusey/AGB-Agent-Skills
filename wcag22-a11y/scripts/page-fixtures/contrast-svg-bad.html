<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SVG chart labels (faint)</title>
<style>body{background:#fff;font-family:sans-serif}svg text{font-size:16px}</style></head><body><main>
<h1>Visits by month</h1>

  <circle cx="30" cy="40" r="9" fill="#1a1a1a"/>
  <text id="lbl-faint" x="44" y="46" fill="#b4b4b4">Faint label</text>
  <rect x="10" y="100" width="300" height="40" fill="#2a2a2a"/>

</svg>
</main></body></html>
