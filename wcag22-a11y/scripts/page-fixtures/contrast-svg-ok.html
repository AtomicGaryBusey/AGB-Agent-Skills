<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SVG chart labels</title>
<style>body{background:#fff;font-family:sans-serif}svg text{font-size:16px}</style></head><body><main>
<h1>Visits by month</h1>
<!-- Dark labels on white; axis lines, tick marks and data markers sit inside each label's box but not behind its glyphs. -->
<svg width="420" height="170" viewBox="0 0 420 170" role="img" aria-labelledby="chart-t"><title id="chart-t">Visits by month</title>
  <rect width="420" height="170" fill="#fff"/>
  <text id="lbl-mar" x="40" y="46" fill="#222">MARCH TOTAL</text>
  <line x1="10" y1="52" x2="400" y2="52" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="98" cy="36" r="3" fill="#000"/>
  <text id="lbl-apr" x="40" y="126" fill="#222">APRIL HIGH</text>
  <line x1="10" y1="131" x2="400" y2="131" stroke="#000" stroke-width="3"/>
  <line x1="92" y1="112" x2="92" y2="128" stroke="#123" stroke-width="2"/>
</svg>
</main></body></html>
