<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dialogs that release focus</title>
<style>.modal{position:fixed;inset:20% 20%;background:#fff;border:2px solid #000;padding:16px}.modal[hidden]{display:none}</style></head><body><main>
<h1>Seed catalogue</h1>
<p><button id="open-native" aria-haspopup="dialog" aria-controls="native">Delivery info</button>
<button id="open-custom" data-bs-toggle="modal" data-bs-target="#custom">Sizes</button> <a href="#list">Browse seeds</a></p><p id="list">Seeds.</p></main>
<dialog id="native"><h2>Delivery</h2><p>We post on Mondays.</p><button id="close-native">Close</button></dialog>
<div id="custom" class="modal" role="dialog" aria-modal="true" aria-label="Packet sizes" hidden><h2>Packet sizes</h2><button id="small">Small</button> <button id="large">Large</button></div>
<script>
var n = document.getElementById('native');
document.getElementById('open-native').addEventListener('click', function () { n.showModal(); });
document.getElementById('close-native').addEventListener('click', function () { n.close(); });
var c = document.getElementById('custom');
document.getElementById('open-custom').addEventListener('click', function () { c.hidden = false; document.getElementById('small').focus(); });
c.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { c.hidden = true; document.getElementById('open-custom').focus(); return; }
  if (e.key !== 'Tab') return;
  e.preventDefault();
  var f = [document.getElementById('small'), document.getElementById('large')];
  f[(f.indexOf(document.activeElement) + 1) % 2].focus();
});
</script></body></html>
