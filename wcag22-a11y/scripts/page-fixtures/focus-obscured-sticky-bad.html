<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sticky header hides focus</title>
<style>html{scroll-behavior:smooth}body{margin:0;font:16px/1.5 system-ui,sans-serif}
.site-head{position:sticky;top:0;z-index:10;height:140px;background:#0b3d2e;color:#fff;padding:0 16px;pointer-events:none}
.site-head a{color:#fff;pointer-events:auto}
.grid{display:flex;gap:24px;padding:16px}.col{flex:1}.gap-l{height:1100px}.gap-s{height:760px}.tail{height:1400px}
a{color:#0645ad}</style></head><body>
<header class="site-head"><p><a href="#top">Orchard Lane Co-op</a></p></header>
<main><h1 id="top">Member news</h1>
<div class="grid">
<div class="col"><div class="gap-l"></div><p><a href="#a1">Harvest report</a></p></div>
<div class="col"><div class="gap-s"></div><p><a href="#b1">Volunteer rota</a></p></div>
</div><div class="tail"></div>
</main></body></html>
