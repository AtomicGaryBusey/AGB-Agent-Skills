<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Booking date trap</title></head><body><main>
<h1>Book a room</h1>
<!-- A script swallows every Tab/Shift+Tab/Escape on the date field, so focus can never leave it. -->
<form>
  <p><label for="d">Date</label> <input id="d" type="date"></p>
  <p><button type="button" id="go">Check availability</button> <a href="#help">Help</a></p>
</form>
<script>
document.getElementById('d').addEventListener('keydown', function (e) { if (e.key === 'Tab' || e.key === 'Escape') e.preventDefault(); });
</script>
</main></body></html>
