<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Booking dates</title></head><body><main>
<h1>Book a room</h1>
<!-- Native date/time inputs: Tab steps through their segments before focus moves on. Not a keyboard trap. -->
<form>
  <p><label for="d">Date</label> <input id="d" type="date"></p>
  <p><label for="t">Start time</label> <input id="t" type="time"></p>
  <p><label for="dt">Reminder</label> <input id="dt" type="datetime-local"></p>
  <p><label for="m">Billing month</label> <input id="m" type="month"></p>
  <p><label for="w">Week</label> <input id="w" type="week"></p>
  <p><button type="button" id="go">Check availability</button> <a href="#help">Help</a></p>
</form>
</main></body></html>
