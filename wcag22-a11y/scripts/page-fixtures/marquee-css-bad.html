<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opening hours banner</title>
<style>.strip{overflow:hidden;background:#222;color:#fff;padding:8px 0;white-space:nowrap}
.strip-text{display:inline-block;padding-left:100%;animation:scroll-left 12s linear infinite}
@keyframes scroll-left{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.busy{width:24px;height:24px;border:3px solid #ccc;border-top-color:#333;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main>
<h1>Visit the pool</h1>
<div class="strip"><span class="strip-text">Pool closed Monday for cleaning. Early swim from 6 a.m. Tuesday to Friday.</span></div>
<div class="busy" role="img" aria-label="Loading"></div>
<p>Lane swimming is available every day.</p>
</main></body></html>
