<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Non-text contrast ok</title>
<style>body{margin:0;padding:16px;background:#fff;font:16px/1.5 system-ui,sans-serif}label{display:block;margin-top:12px}
input[type=text],input[type=email]{border:1px solid #767676;background:#fff;padding:6px}
#dark{border:0;background:#333;color:#fff;padding:6px}
.go{border:2px solid #333;background:#fff;padding:6px 12px}.go:focus{outline:none}.go:focus-visible{outline:3px solid #1a4dbf;outline-offset:2px}
</style></head><body><main><h1>Newsletter</h1><form onsubmit="return false">
<label for="n">Name</label><input id="n" type="text">
<label for="dark">Email</label><input id="dark" type="email" autocomplete="email">
<label><input type="checkbox"> I agree</label>
<p><button class="go">Send</button></p></form></main></body></html>
